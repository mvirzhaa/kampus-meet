# Sebelum menjalankan: sh scripts/render-config.sh   (membuat deploy/*.generated.yaml dari template)
# Jalankan dari folder deploy/:  docker compose --env-file ../.env up -d --build
# Semua layanan media memakai jaringan host agar UDP WebRTC optimal. Port internal (3000, 6379, 7880)
# hanya mendengarkan di 127.0.0.1 / dibuka lewat Caddy.
services:
  redis:                                  # dibutuhkan LiveKit Egress (antrean perintah rekaman)
    image: redis:7-alpine
    restart: unless-stopped
    network_mode: host
    command: ["redis-server", "--bind", "127.0.0.1", "--port", "6379", "--requirepass", "${REDIS_PASSWORD}", "--save", "", "--appendonly", "no"]

  livekit:
    image: livekit/livekit-server:latest  # sematkan versi tertentu (mis. v1.9.x) setelah diuji
    command: --config /etc/livekit.yaml
    restart: unless-stopped
    network_mode: host
    depends_on: [redis]
    volumes:
      - ./livekit.generated.yaml:/etc/livekit.yaml:ro   # dibuat scripts/render-config.sh

  egress:                                 # perekam server (headless Chrome + GStreamer) → MP4 H.264 720p
    image: livekit/egress:latest          # sematkan versi yang cocok dengan livekit-server
    restart: unless-stopped
    network_mode: host
    depends_on: [redis, livekit]
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    volumes:
      - ./egress.generated.yaml:/etc/egress.yaml:ro     # dibuat scripts/render-config.sh
      - ../recordings:/out                # MP4 sementara; dihapus aplikasi setelah terunggah ke Google Drive
    shm_size: "1gb"
    deploy: { resources: { limits: { cpus: "3", memory: 4g } } }

  app:
    build: ..
    restart: unless-stopped
    network_mode: host
    env_file: ../.env
    environment:
      HOST: 127.0.0.1                                  # network_mode host: cukup dengarkan lokal, publik lewat Caddy
      LIVEKIT_URL: http://127.0.0.1:7880
      EGRESS_API_URL: http://127.0.0.1:7880
      TRUST_PROXY: "true"
      RECORDINGS_DIR: /recordings
      RECORDING_TEMPLATE_BASE: http://127.0.0.1:3000   # dibuka Egress dari jaringan host
      EGRESS_WS_URL: ws://127.0.0.1:7880
    volumes:
      - appdata:/app/data
      - ../recordings:/recordings
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    deploy: { resources: { limits: { memory: 768m } } }

  translate:                              # OPSIONAL: cadangan terjemahan transkrip untuk HP/Firefox/Safari
    profiles: ["translate"]               # aktifkan: docker compose --profile translate --env-file ../.env up -d
    image: libretranslate/libretranslate:latest   # sematkan versi tertentu setelah diuji
    restart: unless-stopped
    network_mode: host
    environment:
      LT_HOST: 127.0.0.1                  # hanya lokal; dipanggil aplikasi lewat TRANSLATE_URL=http://127.0.0.1:5000
      LT_PORT: "5000"
      LT_LOAD_ONLY: en,id                 # hanya Indonesia <-> Inggris agar ringan
      LT_DISABLE_WEB_UI: "true"
      LT_UPDATE_MODELS: "true"
    volumes:
      - lt-models:/home/libretranslate/.local
    deploy: { resources: { limits: { cpus: "2", memory: 2g } } }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    network_mode: host
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      MEDIA_DOMAIN: ${MEDIA_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./conf.d:/etc/caddy/conf.d:ro      # situs tambahan, tidak dilacak git
      - caddy_data:/data
      - caddy_config:/config

volumes:
  appdata:
  caddy_data:
  caddy_config:
  lt-models:
