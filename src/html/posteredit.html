<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poster Event — APP</title><link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml"><link rel="icon" href="/favicon.ico?v=3" sizes="48x48"><link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3"><link rel="manifest" href="/site.webmanifest?v=3"><meta name="theme-color" content="#022c22">
<meta name="robots" content="noindex">
<!--CSS:site-->
</head>
<body>
<!--NAV-->
<main class="page pe-page">
  <div class="container pe-container">
    <div class="pe-head">
      <a href="/dashboard#event" class="btn btn-ghost btn-sm"><i data-i="chevron-left" data-s="16"></i>Kembali</a>
      <div class="pe-ttl"><h1>Poster event</h1><small id="pe-sub">Memuat…</small></div>
      <div class="pe-acts">
        <button class="btn btn-ghost btn-sm" id="pe-dl" type="button"><i data-i="download" data-s="16"></i>Unduh PNG</button>
        <button class="btn btn-primary btn-sm" id="pe-save" type="button"><i data-i="check" data-s="16"></i>Simpan &amp; terbitkan</button>
      </div>
    </div>
    <div class="pe-grid">
      <div class="pe-left">
        <div class="pst-wrap" id="pe-poster"></div>
        <section class="section-card pe-share" id="pe-share"></section>
      </div>
      <aside class="pe-form" id="pe-form"></aside>
    </div>
  </div>
</main>
<!--JS:posteredit-->
</body>
</html>
